[server]
headless = true
# Matches the shared 25 MB upload default (AIDA_MAX_UPLOAD_BYTES), so oversized files are
# rejected in the browser before they reach the app. Raise both together.
maxUploadSize = 25
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
base = "light"
primaryColor = "#B04E2F"
backgroundColor = "#F4F1E9"
secondaryBackgroundColor = "#EAE5D8"
textColor = "#202520"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap, serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
baseRadius = "2px"
borderColor = "#D8D3C4"
showWidgetBorder = true
chartCategoricalColors = [
    "#5E6E54",
    "#B04E2F",
    "#6B7F8C",
    "#8C7A5B",
    "#7A6A86",
    "#4F6B5D",
    "#C07A5E",
    "#5B5F57",
]
