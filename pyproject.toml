[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-analyst-agent"
version = "0.1.0"
description = "Grounded Auto-EDA and safe natural-language-to-SQL analytics agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# Domain modules (ingestion, profiling, analysis, sql_agent, ...) must work without the UI.
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "threadpoolctl>=3.1",  # pins BLAS/OpenMP threads so clustering and PCA are reproducible
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "sqlglot>=25.0",  # real SQL parser for the validation layer (no regex-only checks)
]

[project.optional-dependencies]
app = [
  "streamlit>=1.38",
  "plotly>=5.24",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  # mypy resolves imports from the installed environment, so the optional LLM provider
  # packages must be present wherever the type-check runs (CI installs only ".[dev]").
  "google-genai>=1.0",
  "ollama>=0.3",
  "python-dotenv>=1.0",
]
gemini = [
  "google-genai>=1.0",
  "python-dotenv>=1.0",
]
ollama = [
  "ollama>=0.3",
  "python-dotenv>=1.0",  # provider_factory.py loads .env regardless of the chosen provider
]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

# scikit-learn and threadpoolctl ship no type information; treat them as untyped imports.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "threadpoolctl"]
ignore_missing_imports = true
