
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-data-analyst-agent"
version = "0.1.0"
description = "Grounded Auto-EDA and safe natural-language-to-SQL analytics agent"
authors = [{ name = "Somaskandan" }, { name = "Nishi" }, { name = "Prathin" }]
keywords = ["data-analysis", "eda", "text-to-sql", "llm", "streamlit", "explainable", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

# Domain modules must work without the UI.
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "threadpoolctl>=3.1",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "sqlglot>=30.13",
]

[project.urls]
Homepage = "https://github.com/Somaskandan931/AI_Data_Analyst"
Issues = "https://github.com/Somaskandan931/AI_Data_Analyst/issues"
Changelog = "https://github.com/Somaskandan931/AI_Data_Analyst/blob/main/CHANGELOG.md"

[project.optional-dependencies]
app = [
  "streamlit>=1.66",
  "plotly>=5.24",
  "python-dotenv>=1.0",
]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.13",
  "mypy>=1.13",
  "pandas-stubs>=3.0",
  "google-genai>=1.20",
  "ollama>=0.4.7",
  "python-dotenv>=1.0",
  "markdown>=3.4",
]
gemini = [
  "google-genai>=1.0",
  "python-dotenv>=1.0",
]
ollama = [
  "ollama>=0.4.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: needs external services (for example a local Ollama server); skipped when unavailable",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

# scikit-learn and threadpoolctl ship no type information; treat them as untyped imports.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*", "threadpoolctl"]
ignore_missing_imports = true
